<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Peliculas API</title>
  <style>
    * {
      box-sizing: border-box;
    }
    :root {
      --primary-color: #92b4f4;
      --secondary-color: #403d58;
      --terceary-color: #f78e69;
    }
    body {
      background-color: var(--primary-color);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
    }
    header {
      padding: 16px;
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 10px;
      background-color: var(--secondary-color);
    }
    .search {
      background-color: green;
      border: 5px solid var(--terceary-color);
      border-radius: 50px;
      font-family: Verdana, Geneva, Tahoma, sans-serif;
      font-size: 15px;
      padding: 10px 20px;
      color: var(--primary-color);
    }
    .search::placeholder {
      color: var(--terceary-color);
    }
    .search:focus {
      outline: none;
      background-color: var(--primary-color);
      color: black;
    }
    main {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      padding: 15px;
      gap: 15px;
    }
    .movie {
      width: 300px;
      background-color: var(--secondary-color);
      box-shadow: 0 5px 5px black;
      position: relative;
      overflow: hidden;
      border-radius: 20px;
    }
    .movie img {
      width: 100%;
      height: 450px;
      object-fit: cover;
    }
    .movie-info {
      color: var(--terceary-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 4px;
      padding: 8px 15px 15px;
      letter-spacing: 2px;
    }
    .movie-info h3 {
      margin-top: 0;
      font-size: 18px;
      flex: 1;
    }
    .movie-info span {
      background-color: var(--primary-color);
      padding: 5px 8px;
      border-radius: 5px;
      font-weight: bold;
      min-width: 40px;
      text-align: center;
    }
    .movie-info span.blue {
      color: blue;
    }
    .movie-info span.orange {
      color: orange;
    }
    .movie-info span.red {
      color: red;
    }
  </style>
</head>
<body>
  <header>
    <img src="pika.jpg" alt="logo" style="width: 50px;" />
    <input type="text" id="search" class="search" placeholder="Busca tu Pelicula" />
  </header>
  <main id="main"></main>

  <script>
    const API_KEY = '3fd2be6f0c70a2a598f084ddfb75487c';
    const API_URL = `https://api.themoviedb.org/3/discover/movie?sort_by=popularity.desc&api_key=${API_KEY}&page=1`;
    const IMG_PATH = 'https://image.tmdb.org/t/p/w500';
    const SEARCH_API = `https://api.themoviedb.org/3/search/movie?api_key=${API_KEY}&query=`;

    const main = document.getElementById('main');
    const search = document.getElementById('search');

    // Carga inicial de películas populares
    getMovies(API_URL);

    async function getMovies(url) {
      try {
        const res = await fetch(url);
        const data = await res.json();
        showMovies(data.results);
      } catch (error) {
        main.innerHTML = `<p style="color: red;">Error al cargar las películas.</p>`;
        console.error(error);
      }
    }

    function showMovies(movies) {
      main.innerHTML = '';

      movies.forEach(movie => {
        const { title, poster_path, vote_average } = movie;

        const movieElement = document.createElement('div');
        movieElement.classList.add('movie');

        movieElement.innerHTML = `
          <img src="${poster_path ? IMG_PATH + poster_path : 'https://via.placeholder.com/300x450?text=Sin+Imagen'}" alt="${title}" />
          <div class="movie-info">
            <h3>${title}</h3>
            <span class="${getClassByRate(vote_average)}">${vote_average.toFixed(1)}</span>
          </div>
        `;

        main.appendChild(movieElement);
      });
    }

    function getClassByRate(vote) {
      if (vote >= 7) {
        return 'blue';
      } else if (vote >= 5) {
        return 'orange';
      } else {
        return 'red';
      }
    }

    // Búsqueda al escribir
    search.addEventListener('keyup', (e) => {
      const searchTerm = e.target.value.trim();

      if (searchTerm) {
        getMovies(SEARCH_API + encodeURIComponent(searchTerm));
      } else {
        getMovies(API_URL);
      }
    });
  </script>
</body>
</html>
